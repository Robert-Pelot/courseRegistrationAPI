name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/CourseRegistration.Api.Tests/CourseRegistration.Api.Tests.csproj

      - name: Build
        run: dotnet build tests/CourseRegistration.Api.Tests/CourseRegistration.Api.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CourseRegistration.Api.Tests/CourseRegistration.Api.Tests.csproj --configuration Release --no-build --verbosity normal
